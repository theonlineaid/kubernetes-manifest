apiVersion: batch/v1
kind: Job
metadata:
  name: backend-seed
  namespace: app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600   # auto-cleanup the completed pod after 1h
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for postgres..."; sleep 2;
              done
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
      containers:
        - name: seed
          image: onlineaid/backend-app:latest
          command: ["node", "seed.js"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret