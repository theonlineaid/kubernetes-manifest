# Helm values for the kube-prometheus-stack chart (Prometheus Operator +
# Prometheus + Alertmanager + Grafana + node-exporter + kube-state-metrics).
# Wired in via ../argocd/monitoring-app.yml (multi-source Application: chart
# from the prometheus-community Helm repo, values from this file).
#
# Tuned down for a small bare-metal cluster (1 master + 1 worker VM) — raise
# resources/retention/storage below if the nodes have room to spare.

# --- Grafana: only UI exposed outside the cluster, via NodePort 30300 ---
# (same pattern as pgAdmin — see infra/backend/pgadmin.yml: internal ops
# tool, no public Gateway/DNS entry)
grafana:
  service:
    type: NodePort
    nodePort: 30300
  persistence:
    enabled: true
    size: 2Gi
  # Real admin credentials never go in git — create the `grafana-admin`
  # Secret imperatively first (see infra/READ.md §12).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# --- Prometheus: kept internal (ClusterIP), reach it via port-forward ---
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

prometheus-node-exporter:
  # Must run on the master too (kubeadm taints it NoSchedule by default) or
  # you lose host metrics for that node entirely — with only 2 nodes total
  # that's half your fleet blind.
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
