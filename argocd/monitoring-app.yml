# Prometheus + Grafana cluster monitoring, via the community kube-prometheus-stack
# Helm chart (Prometheus Operator + Prometheus + Alertmanager + Grafana +
# node-exporter + kube-state-metrics, all in one chart).
#
# Multi-source Application: the chart itself comes from the prometheus-community
# Helm repo, and its values.yaml comes from this git repo's monitoring/ folder
# (referenced via the `$values` placeholder below), so the values stay
# diffable/reviewable like every other manifest in this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.2
      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://github.com/theonlineaid/kubernetes-manifest.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
